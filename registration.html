<html><head>
    <title>Registraction form</title>
    <script>
        function passvalues()
        {
            var name=document.getElementById("name").value;
            var email=document.getElementById("email").value;
            var address=document.getElementById("address").value;
            localStorage.setIteam("name",name);
            localStorage.setIteam("email",email);
            localStorage.setIteam("address",address);
            return;
        }
    </script>
</head>
<body>
    <h1>Registraction form</h1>
    <form action="Details.html">
        <fieldset>
            <legend>Registraction</legend>
            <label>Name</label>
            <input type="text" id="name"/><br><br>
            <label>email ID</label>
            <input type="email" id="email"/><br><br>
            <label>address</label>
            <input type="address" id="address"/><br><br>
            <input type="submit" value="submit" onclick="passvalues()"/>
        </fieldset>
    </form>
</body>
</html>
